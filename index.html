<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cas RC Trainingsweek</title>
  <meta name="description" content="Cas RC training programme">
  <meta name="theme-color" content="#0d0d0b">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">

  <!-- Beginscherm / app-modus.
       ?v=9 achter elk bestand dwingt browsers de nieuwste versie te laden.
       Verhoog dit getal (overal tegelijk) als je iets wijzigt. -->
  <link rel="manifest" href="manifest.webmanifest?v=9">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg?v=9">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=9">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cas RC">

  <!-- Lettertypes (met fallbacks: de app werkt ook zonder) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <!-- Logo: kettlebell met gele gradient (staat direct in de pagina, dus altijd zichtbaar) -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="kb-grad" x1="140" y1="90" x2="380" y2="446" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffe680"/>
        <stop offset=".5" stop-color="#f5c518"/>
        <stop offset="1" stop-color="#d98e04"/>
      </linearGradient>
      <clipPath id="kb-base"><rect x="0" y="0" width="512" height="440"/></clipPath>
      <symbol id="kettlebell" viewBox="0 0 512 512">
        <path d="M168 268 C142 196 150 108 256 106 C362 108 370 196 344 268" fill="none" stroke="url(#kb-grad)" stroke-width="36" stroke-linecap="round"/>
        <circle cx="256" cy="320" r="132" fill="url(#kb-grad)" clip-path="url(#kb-base)"/>
      </symbol>
    </defs>
  </svg>

  <div class="hoops" aria-hidden="true"></div>

  <header class="wrap top">
    <div class="titlerow">
      <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><use href="#kettlebell"/></svg>
      <h1 data-i18n="title">Trainingsweek</h1>
    </div>
    <div class="navrow">
      <div class="viewtabs" role="tablist" data-i18n-aria="viewAria" aria-label="Weergave">
        <button type="button" role="tab" id="tab-schema" data-view="schema" aria-selected="true" data-i18n="tabSchema">Schema</button>
        <button type="button" role="tab" id="tab-stats" data-view="stats" aria-selected="false" data-i18n="tabStats">Stats</button>
      </div>
      <div class="lang" role="group" data-i18n-aria="langAria" aria-label="Taal">
        <button type="button" data-lang="nl" aria-pressed="true">NL</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <nav class="days" id="daysNav" data-i18n-aria="daysAria" aria-label="Dagen van de week">
    <div class="wrap days-grid" id="days" role="tablist"></div>
  </nav>

  <main class="wrap" id="main"></main>
  <main class="wrap" id="stats" hidden></main>

  <p class="toast" id="toast" role="status" hidden></p>

  <div class="timer" id="timer">
    <div class="wrap timer-row">
      <div class="clock-box">
        <span class="tlabel" id="tlabel" data-i18n="rest">Rust</span>
        <span class="clock" id="clock">0:00</span>
      </div>
      <div class="tbtns">
        <button type="button" data-s="30">30s</button>
        <button type="button" data-s="60">60s</button>
        <button type="button" data-s="90">90s</button>
        <button type="button" data-s="120">2m</button>
        <button type="button" class="stop" id="stop" data-i18n="stop">Stop</button>
      </div>
    </div>
  </div>

  <!-- Keuzelijst: training wisselen -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-body"></div>
  </div>

  <!-- Schermvullende flits als de rust voorbij is -->
  <div class="flash" id="flash" role="alert" hidden>
    <svg class="flash-mark" viewBox="0 0 512 512" aria-hidden="true"><use href="#kettlebell"/></svg>
    <strong id="flashWord">DONE</strong>
    <span id="flashText"></span>
  </div>

  <noscript><p class="wrap">Zet JavaScript aan om het schema te zien. / Turn on JavaScript to see the programme.</p></noscript>

  <script src="i18n.js?v=9"></script>
  <script src="data.js?v=9"></script>
  <script src="store.js?v=9"></script>
  <script src="stats.js?v=9"></script>
  <script src="sync.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
